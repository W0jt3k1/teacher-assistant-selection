[project]
name = "teacher-assistant-selection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.15"

dependencies = [
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
xpu = [
    "torch==2.15.0",
    "torchvision==0.29.2",
    "triton-xpu>=3.9.0,<3.10",
]
cuda = [
    "torch==2.15.0",
    "torchvision==0.29.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "xpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-xpu", extra = "xpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-xpu", extra = "xpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]
triton-xpu = { index = "pytorch-xpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
