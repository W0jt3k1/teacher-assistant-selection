[project]
name = "teacher-assistant-selection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "triton-xpu>=3.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.sources]
torch = { index = "pytorch-xpu" }
torchvision = { index = "pytorch-xpu" }
triton-xpu = { index = "pytorch-xpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
